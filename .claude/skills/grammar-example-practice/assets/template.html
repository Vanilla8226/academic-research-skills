<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #5d6470;
    --line: #e2ded5;
    --accent: #2f5d8a;
    --accent-soft: #e6eef6;
    --quote: #f3f0e8;
    --mark: #fde68a;
    --mark-text: #1f2328;
    --warn-bg: #fff4e5;
    --warn-text: #8a4b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c;
      --card: #1f2227;
      --text: #e6e6e6;
      --muted: #a1a7b0;
      --line: #33373e;
      --accent: #8db7e0;
      --accent-soft: #24303d;
      --quote: #262a30;
      --mark: #7a5d12;
      --mark-text: #fff7e0;
      --warn-bg: #3a2a12;
      --warn-text: #ffd59a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 28px; }
  button {
    font: inherit; font-size: 0.95rem; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 6px 14px;
  }
  button:hover { border-color: var(--accent); }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 22px 22px 18px; margin-bottom: 22px;
  }
  .eyebrow {
    margin: 0; color: var(--accent); font-size: 0.8rem;
    font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .card h2 { font-size: 1.25rem; line-height: 1.3; margin: 4px 0 14px; }
  .source { background: var(--quote); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
  .source .label { margin: 0; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .source .cite { margin: 2px 0 6px; font-weight: 600; }
  .source blockquote { margin: 6px 0 0; padding-left: 12px; border-left: 3px solid var(--accent); }
  .source .lecture-examples { margin: 8px 0 0; color: var(--muted); font-size: 0.95rem; }
  .warn { background: var(--warn-bg); color: var(--warn-text); }
  .task { margin: 0 0 12px; }
  textarea {
    width: 100%; min-height: 70px; resize: vertical; font: inherit;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    background: var(--bg); color: var(--text); margin-bottom: 12px;
  }
  details { border-top: 1px solid var(--line); padding: 10px 0 2px; }
  summary {
    cursor: pointer; font-weight: 600; color: var(--accent);
    list-style: none; display: inline-flex; align-items: center; gap: 8px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: "\25B8"; transition: transform 0.15s; }
  details[open] > summary::before { transform: rotate(90deg); }
  details:not([open]) .when-open, details[open] .when-closed { display: none; }
  .answer-body { padding: 10px 0 4px; }
  .sentence { font-size: 1.15rem; margin: 0 0 10px; }
  mark { background: var(--mark); color: var(--mark-text); padding: 0 2px; border-radius: 3px; }
  .analysis {
    background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; margin: 0 0 10px;
    overflow-x: auto; font: 0.9rem/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
  }
  .explanation { margin: 0 0 8px; }
  .answer-body + .answer-body { border-top: 1px dashed var(--line); padding-top: 14px; }
  footer { color: var(--muted); font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>{{TITLE}}</h1>
    <p>{{SUBTITLE}}</p>
  </header>
  <div class="toolbar">
    <button type="button" data-toggle="open">Show all answers</button>
    <button type="button" data-toggle="close">Hide all answers</button>
  </div>
{{EXERCISES}}
  <footer>Created {{DATE}}. Try each one yourself before opening the answer.</footer>
</main>
<script>
  document.querySelectorAll("[data-toggle]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var open = btn.getAttribute("data-toggle") === "open";
      document.querySelectorAll("details.answer").forEach(function (d) { d.open = open; });
    });
  });
</script>
</body>
</html>
